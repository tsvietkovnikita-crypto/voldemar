# Lavalink 4.2 configuration for Voldemar.
#
# Start Lavalink through `uv run voldemar` (or `uv run voldemar-lavalink`): the launcher overrides the
# values marked "from .env" using Spring environment variables (SERVER_PORT, LAVALINK_SERVER_PASSWORD,
# PLUGINS_YOUTUBE_OAUTH_ENABLED, ...), so secrets never have to be written into this file.

server:
  port: 2333 # from .env: LAVALINK_PORT
  address: 127.0.0.1 # from .env: LAVALINK_HOST. Localhost only, so Lavalink isn't reachable from the network.
  http2:
    enabled: false

lavalink:
  plugins:
    # YouTube and YouTube Music. When YouTube playback breaks, bump this version first:
    # https://github.com/lavalink-devs/youtube-source/releases
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    # Apple Music (and more sources we don't enable): https://github.com/topi314/LavaSrc/releases
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    password: "youshallnotpass" # from .env: LAVALINK_PASSWORD
    sources:
      youtube: false # the built-in YouTube source is deprecated; youtube-plugin replaces it
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: false
      # Direct audio links let any server member make this PC fetch arbitrary URLs (including devices on
      # your home network) and reveal your IP to the link's host. from .env: ALLOW_DIRECT_LINKS
      http: false
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6 # pages of 100 tracks
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true # enables ytsearch: and ytmsearch:
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Queried in order. MUSIC handles YouTube Music search; the rest play audio. TV is only used when
    # OAuth is enabled (YOUTUBE_OAUTH_ENABLED in .env) and acts as the last-resort fallback.
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
      - TVHTML5_SIMPLY
      - TV
    oauth:
      enabled: false # from .env: YOUTUBE_OAUTH_ENABLED (+ YOUTUBE_OAUTH_REFRESH_TOKEN)
    # If signature deciphering keeps failing, run https://github.com/kikkia/yt-cipher and uncomment:
    # remoteCipher:
    #   url: "http://localhost:8001"
    #   password: "your_secret_password"

  lavasrc:
    # How Apple Music tracks are found on YouTube: exact recording by ISRC first, then by title and artist.
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
    sources:
      spotify: false # Spotify links are resolved by the bot itself (see src/voldemar/music/spotify.py)
      applemusic: true
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
    applemusic:
      countryCode: "US" # from .env: APPLE_MUSIC_COUNTRY
      # No mediaAPIToken here: LavaSrc fetches one from music.apple.com automatically.
      # from .env (optional override): APPLE_MUSIC_MEDIA_TOKEN
      playlistLoadLimit: 6
      albumLoadLimit: 6

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO # prints the sign-in code and refresh token
  request:
    enabled: false
